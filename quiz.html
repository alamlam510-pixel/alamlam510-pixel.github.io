<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Korean Connect ♡ Quiz</title>
  
  <!-- Google Fonts - supports Korean & Traditional Chinese -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <script src="nav.js"></script>

  <style>
    :root {
      --bg-soft:      #fffaf5;
      --primary-pink:  #ff9aa2;
      --primary-red:   #ff6b6b;
      --mint:          #a8e6cf;
      --teal:          #2a9d8f;
      --light:         #ffffff;
      --text-dark:     #2d3436;
      --glow:          rgba(255, 154, 162, 0.25);
      --glow-mint:     rgba(168, 230, 207, 0.3);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans TC', 'Noto Sans KR', system-ui, sans-serif;
      background: linear-gradient(135deg, var(--bg-soft) 0%, #f0fff5 100%);
      color: var(--text-dark);
      line-height: 1.6;
    }

    /* Navigation */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,154,162,0.18);
      z-index: 1000;
      padding: 16px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }

    .logo {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--primary-pink);
      text-decoration: none;
    }

    .logo span {
      color: var(--teal);
    }

    .nav-links {
      display: flex;
      gap: 36px;
      list-style: none;
    }

    .nav-links a {
      color: var(--text-dark);
      text-decoration: none;
      font-weight: 500;
      font-size: 1.05rem;
      transition: all 0.3s;
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: var(--primary-pink);
      transform: translateY(-2px);
    }

    /* Hero */
    header.hero {
      background: linear-gradient(135deg, var(--primary-red) 20%, var(--primary-pink) 80%);
      color: white;
      text-align: center;
      padding: 180px 6% 100px;
      position: relative;
      overflow: hidden;
      margin-top: 80px;
    }

    .hero::before {
      content: '';
      position: absolute;
      inset: -50%;
      background: radial-gradient(circle at 30% 70%, rgba(255,255,255,0.4) 0%, transparent 65%);
      animation: gentleFloat 22s infinite linear;
      pointer-events: none;
    }

    @keyframes gentleFloat {
      0%   { transform: translate(0,0) rotate(0deg); }
      100% { transform: translate(140%, 90%) rotate(360deg); }
    }

    h1 {
      font-size: 5rem;
      font-weight: 800;
      margin-bottom: 16px;
      text-shadow: 0 6px 24px rgba(0,0,0,0.3);
      position: relative;
      z-index: 2;
    }

    .subtitle {
      font-size: 1.8rem;
      max-width: 800px;
      margin: 0 auto;
      opacity: 0.96;
      position: relative;
      z-index: 2;
    }

    /* Quiz Section */
    section {
      padding: 80px 6%;
      text-align: center;
    }

    .quiz-game {
      max-width: 700px;
      margin: 0 auto;
      background: var(--light);
      border-radius: 28px;
      box-shadow: 0 16px 60px var(--glow);
      padding: 48px;
    }

    .progress-container {
      display: flex;
      justify-content: space-between;
      margin-bottom: 24px;
      font-size: 1.1rem;
      color: #666;
    }

    .progress-container span {
      font-weight: 600;
      color: var(--primary-pink);
    }

    .progress-bar {
      height: 12px;
      background: #f0f0f0;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 32px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary-pink), var(--primary-red));
      border-radius: 12px;
      transition: width 0.4s ease;
      width: 0%;
    }

    .timer {
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--primary-red);
      margin-bottom: 24px;
    }

    .timer.warning {
      animation: pulse 0.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    .question {
      background: linear-gradient(135deg, var(--glow) 0%, var(--glow-mint) 100%);
      border-radius: 20px;
      padding: 36px;
      margin-bottom: 32px;
    }

    .question-label {
      font-size: 1.1rem;
      color: #666;
      margin-bottom: 12px;
    }

    .question-text {
      font-size: 2.2rem;
      font-weight: 600;
    }

    .question-text span {
      color: var(--primary-red);
    }

    .speak-btn {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      opacity: 0.7;
      transition: all 0.25s;
      vertical-align: middle;
      margin-left: 8px;
    }

    .speak-btn:hover {
      opacity: 1;
      transform: scale(1.15);
    }

    .options {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .option {
      padding: 24px 20px;
      border: 2px solid #e0e0e0;
      border-radius: 16px;
      font-size: 1.3rem;
      font-weight: 500;
      background: var(--light);
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .option:hover {
      border-color: var(--primary-pink);
      background: #fff5f5;
      transform: translateY(-3px);
    }

    .option.correct {
      border-color: var(--mint);
      background: #e8f8f0;
      color: var(--teal);
    }

    .option.wrong {
      border-color: var(--primary-red);
      background: #ffeaea;
      color: var(--primary-red);
    }

    .option.disabled {
      pointer-events: none;
      opacity: 0.7;
    }

    .feedback {
      margin-top: 24px;
      padding: 20px;
      border-radius: 16px;
      font-size: 1.2rem;
      font-weight: 600;
      display: none;
    }

    .feedback.show { display: block; }
    .feedback.correct { background: #e8f8f0; color: var(--teal); }
    .feedback.wrong { background: #ffeaea; color: var(--primary-red); }

    .btn {
      margin-top: 20px;
      padding: 18px 36px;
      border: none;
      border-radius: 16px;
      font-size: 1.2rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary-pink), var(--primary-red));
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(255, 107, 107, 0.35);
    }

    .btn-secondary {
      background: linear-gradient(135deg, var(--mint), var(--teal));
      color: white;
    }

    .btn-secondary:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(42, 157, 143, 0.35);
    }

    .result {
      text-align: center;
    }

    .result-score {
      font-size: 5rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--primary-pink), var(--primary-red));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .result-message {
      font-size: 1.6rem;
      color: #666;
      margin: 20px 0 40px;
    }

    footer {
      padding: 80px 6% 60px;
      background: linear-gradient(to top, #f0fff5, transparent);
      text-align: center;
      color: #555;
      font-size: 1.15rem;
    }

    @media (max-width: 700px) {
      .options { grid-template-columns: 1fr; }
      h1 { font-size: 3rem; }
      .question-text { font-size: 1.6rem; }
      .quiz-game { padding: 28px; }
    }
  </style>
</head>
<body>
<div id="nav-placeholder"></div>

  <!-- Hero -->
  <header class="hero">
    <h1>Korean Quiz</h1>
    <p class="subtitle">Test your knowledge of colors, numbers, greetings, and more!</p>
  </header>

  <!-- Quiz Game -->
  <section>
    <div class="quiz-game" id="quiz">
      <div class="progress-container">
        <div><span id="questionNum">Question 1</span></div>
        <div>Score: <span id="scoreDisplay">0</span></div>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="timer" id="timer">2:00</div>
      <div class="question">
        <div class="question-label">What is the Korean for</div>
        <div class="question-text"><span id="targetWord">red</span>? <button class="speak-btn" id="speakHintBtn" title="Hear Korean">🔊</button></div>
      </div>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback"></div>
      <button class="btn btn-secondary" id="speakBtn" style="display:none">🔊 Hear Pronunciation</button>
      <button class="btn btn-primary" id="nextBtn" style="display:none">Next Question</button>
    </div>

    <div class="quiz-game hidden" id="result">
      <div class="result">
        <div class="result-score" id="finalScore">8/10</div>
        <div class="result-message" id="resultMessage">Great job! 🌟</div>
        <button class="btn btn-primary" onclick="restartQuiz()">Play Again</button>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <p>화이팅! Keep practicing your Korean! ♡</p>
  </footer>

  <script>
    const questions = [
      { type: 'color', target: 'red', answer: '빨강' },
      { type: 'color', target: 'blue', answer: '파랑' },
      { type: 'color', target: 'yellow', answer: '노랑' },
      { type: 'color', target: 'green', answer: '초록' },
      { type: 'color', target: 'white', answer: '하양' },
      { type: 'color', target: 'black', answer: '검정' },
      { type: 'color', target: 'purple', answer: '보라' },
      { type: 'color', target: 'orange', answer: '주황' },
      { type: 'color', target: 'pink', answer: '분홍' },
      { type: 'color', target: 'gray', answer: '회색' },
      { type: 'number', target: 'one', answer: '하나' },
      { type: 'number', target: 'two', answer: '둘' },
      { type: 'number', target: 'three', answer: '셋' },
      { type: 'number', target: 'four', answer: '넷' },
      { type: 'number', target: 'five', answer: '다섯' },
      { type: 'number', target: 'six', answer: '여섯' },
      { type: 'number', target: 'seven', answer: '일곱' },
      { type: 'number', target: 'eight', answer: '여덟' },
      { type: 'number', target: 'nine', answer: '아홉' },
      { type: 'number', target: 'ten', answer: '열' },
      { type: 'greeting', target: 'hello', answer: '안녕하세요' },
      { type: 'greeting', target: 'thank you', answer: '감사합니다' },
      { type: 'greeting', target: 'goodbye', answer: '안녕히 가세요' },
      { type: 'greeting', target: 'please', answer: '부탁합니다' },
      { type: 'greeting', target: 'yes', answer: '네' },
      { type: 'greeting', target: 'no', answer: '아니요' },
      { type: 'animal', target: 'dog', answer: '개' },
      { type: 'animal', target: 'cat', answer: '고양이' },
      { type: 'animal', target: 'bird', answer: '새' },
      { type: 'animal', target: 'fish', answer: '물고기' },
      { type: 'food', target: 'rice', answer: '밥' },
      { type: 'food', target: 'water', answer: '물' },
      { type: 'food', target: 'bread', answer: '빵' },
      { type: 'food', target: 'apple', answer: '사과' },
    ];

    const wrongOptions = {
      '빨강': ['파랑', '노랑', '초록', '하양', '검정', '보라', '주황', '분홍', '회색'],
      '파랑': ['빨강', '노랑', '초록', '하양', '검정', '보라', '주황', '분홍', '회색'],
      '노랑': ['빨강', '파랑', '초록', '하양', '검정', '보라', '주황', '분홍', '회색'],
      '초록': ['빨강', '파랑', '노랑', '하양', '검정', '보라', '주황', '분홍', '회색'],
      '하양': ['빨강', '파랑', '노랑', '초록', '검정', '보라', '주황', '분홍', '회색'],
      '검정': ['빨강', '파랑', '노랑', '초록', '하양', '보라', '주황', '분홍', '회색'],
      '보라': ['빨강', '파랑', '노랑', '초록', '하양', '검정', '주황', '분홍', '회색'],
      '주황': ['빨강', '파랑', '노랑', '초록', '하양', '보라', '분홍', '회색'],
      '분홍': ['빨강', '파랑', '노랑', '초록', '하양', '보라', '주황', '회색'],
      '회색': ['빨강', '파랑', '노랑', '초록', '하양', '보라', '주황', '분홍'],
      '하나': ['둘', '셋', '넷', '다섯', '여섯', '일곱', '여덟', '아홉', '열'],
      '둘': ['하나', '셋', '넷', '다섯', '여섯', '일곱', '여덟', '아홉', '열'],
      '셋': ['하나', '둘', '넷', '다섯', '여섯', '일곱', '여덟', '아홉', '열'],
      '넷': ['하나', '둘', '셋', '다섯', '여섯', '일곱', '여덟', '아홉', '열'],
      '다섯': ['하나', '둘', '셋', '넷', '여섯', '일곱', '여덟', '아홉', '열'],
      '여섯': ['하나', '둘', '셋', '넷', '다섯', '일곱', '여덟', '아홉', '열'],
      '일곱': ['하나', '둘', '셋', '넷', '다섯', '여섯', '여덟', '아홉', '열'],
      '여덟': ['하나', '둘', '셋', '넷', '다섯', '여섯', '일곱', '아홉', '열'],
      '아홉': ['하나', '둘', '셋', '넷', '다섯', '여섯', '일곱', '여덟', '열'],
      '열': ['하나', '둘', '셋', '넷', '다섯', '여섯', '일곱', '여덟', '아홉'],
      '안녕하세요': ['안녕', '안녕히 가세요', '감사합니다', '부탁합니다', '죄송합니다'],
      '감사합니다': ['안녕하세요', '부탁합니다', '죄송합니다', '고마워요', '천만에요'],
      '안녕히 가세요': ['안녕하세요', '안녕', '다시 봐요', '감사합니다', '부탁합니다'],
      '부탁합니다': ['감사합니다', '부탁해요', '제발', '도와주세요', '안녕하세요'],
      '네': ['아니요', '예', '그래요', '알겠어요', '맞아요'],
      '아니요': ['네', '예', '틀려요', '그런데', '근데'],
      '개': ['고양이', '새', '물고기', '토끼', '곰'],
      '고양이': ['개', '새', '물고기', '토끼', '고래'],
      '새': ['개', '고양이', '물고기', '토끼', '나비'],
      '물고기': ['개', '고양이', '새', '토끼', '고래'],
      '밥': ['빵', '물', '사과', '바나나', '고기'],
      '물': ['밥', '빵', '사과', '바나나', '우유'],
      '빵': ['밥', '물', '사과', '바나나', '케이크'],
      '사과': ['밥', '물', '빵', '바나나', '포도'],
    };

    const numberMap = { one: '1', two: '2', three: '3', four: '4', five: '5', six: '6', seven: '7', eight: '8', nine: '9', ten: '10' };

    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let totalAnswered = 0;
    let timer;
    let timeLeft = 120;
    let answered = false;
    let gameEnded = false;

    function shuffle(arr) {
      return arr.sort(() => Math.random() - 0.5);
    }

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${mins}:${secs.toString().padStart(2, '0')}`;
    }

    function generateOptions(correct) {
      const wrong = wrongOptions[correct] || ['보기1', '보기2', '보기3', '보기4'];
      const shuffledWrong = shuffle([...wrong]);
      return shuffle([correct, ...shuffledWrong.slice(0, 3)]);
    }

    function speakKorean(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ko-KR';
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
      }
    }

    function initQuiz() {
      currentQuestions = shuffle([...questions]);
      currentIndex = 0;
      score = 0;
      totalAnswered = 0;
      timeLeft = 120;
      gameEnded = false;
      showQuestion();
    }

    function showQuestion() {
      if (gameEnded) return;
      
      answered = false;
      const q = currentQuestions[currentIndex];
      
      document.getElementById('questionNum').textContent = `Question ${totalAnswered + 1}`;
      document.getElementById('scoreDisplay').textContent = score;
      document.getElementById('targetWord').textContent = q.type === 'number' ? numberMap[q.target] : q.target;
      
      const optionsContainer = document.getElementById('options');
      optionsContainer.innerHTML = '';
      
      const options = generateOptions(q.answer);
      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'option';
        btn.textContent = opt;
        btn.onclick = () => selectAnswer(opt, q.answer);
        optionsContainer.appendChild(btn);
      });

      document.getElementById('feedback').className = 'feedback';
      document.getElementById('nextBtn').style.display = 'none';
      document.getElementById('speakBtn').style.display = 'none';
      
      document.getElementById('speakHintBtn').onclick = () => speakKorean(q.answer);
      startTimer();
    }

    function startTimer() {
      clearInterval(timer);
      const timerEl = document.getElementById('timer');
      timerEl.classList.remove('warning');
      timerEl.textContent = formatTime(timeLeft);
      
      timer = setInterval(() => {
        timeLeft--;
        timerEl.textContent = formatTime(timeLeft);
        if (timeLeft <= 30) timerEl.classList.add('warning');
        if (timeLeft <= 0) {
          clearInterval(timer);
          endGame();
        }
      }, 1000);
    }

    function selectAnswer(selected, correct) {
      if (answered || gameEnded) return;
      answered = true;
      clearInterval(timer);
      totalAnswered++;

      const options = document.querySelectorAll('.option');
      options.forEach(opt => {
        opt.classList.add('disabled');
        if (opt.textContent === correct) opt.classList.add('correct');
        if (opt.textContent === selected && selected !== correct) opt.classList.add('wrong');
      });

      const feedback = document.getElementById('feedback');
      if (selected === correct) {
        score++;
        feedback.textContent = '✓ Correct! Well done!';
        feedback.className = 'feedback show correct';
      } else {
        feedback.textContent = `✗ The answer is: ${correct}`;
        feedback.className = 'feedback show wrong';
      }

      const progressPercent = Math.round((totalAnswered / 20) * 100);
      document.getElementById('progressFill').style.width = progressPercent + '%';
      document.getElementById('scoreDisplay').textContent = score;
      document.getElementById('speakBtn').style.display = 'block';
      document.getElementById('speakBtn').onclick = () => speakKorean(correct);
      document.getElementById('nextBtn').style.display = 'block';
    }

    document.getElementById('nextBtn').onclick = () => {
      currentIndex = (currentIndex + 1) % currentQuestions.length;
      if (!gameEnded) {
        showQuestion();
      }
    };

    function endGame() {
      gameEnded = true;
      clearInterval(timer);
      showResult();
    }

    function showResult() {
      document.getElementById('quiz').classList.add('hidden');
      document.getElementById('result').classList.remove('hidden');
      document.getElementById('finalScore').textContent = `${score}/${totalAnswered}`;
      
      const percentage = totalAnswered > 0 ? Math.round((score / totalAnswered) * 100) : 0;
      let msg = '';
      if (percentage >= 90) msg = "Perfect! You're a Korean master! ★";
      else if (percentage >= 70) msg = "Great job! Keep it up! ✨";
      else if (percentage >= 50) msg = "Good effort! Practice more! 💪";
      else msg = "Keep practicing! You can do it! 🌱";
      document.getElementById('resultMessage').textContent = msg;
    }

    function restartQuiz() {
      document.getElementById('result').classList.add('hidden');
      document.getElementById('quiz').classList.remove('hidden');
      document.getElementById('progressFill').style.width = '0%';
      initQuiz();
    }

    initQuiz();
  </script>
  <script src="nav.js"></script>
</body>
</html>
